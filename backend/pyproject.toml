[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=0",    # Will increase as tests are added
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires running services)",
    "e2e: End-to-end tests",
    "slow: Tests that take a long time to run",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/", ".venv/", "venv/"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = [
    # B008 forbids function calls in argument defaults, but `Depends(...)`,
    # `Query(...)` and `File(...)` in defaults *are* the FastAPI idiom — the
    # framework evaluates them per-request, so the rule's rationale does not
    # apply here.  Previously suppressed with scattered per-file noqa headers.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# N806 wants lowercase locals, but `X` / `X_scaled` for a feature matrix is
# the universal scikit-learn convention; renaming them would make the ML code
# read *less* like every other sklearn pipeline.
"app/modules/anomaly/application/model_training_service.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
