# Serves the built SPA and proxies /api to the backend container, mirroring
# vite.config.ts's dev-server proxy so the app talks to the same relative
# path (/api/v1) in both environments.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls — same-origin from the browser's point of view, so no CORS
    # configuration is needed on the backend for this deployment.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: let React Router handle unknown paths instead of nginx
    # 404-ing on a hard refresh of e.g. /alerts.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets; index.html itself is not
    # cached, so a redeploy is picked up on the next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
