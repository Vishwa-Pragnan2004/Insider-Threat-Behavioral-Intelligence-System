# ============================================================
# ITBIS — Docker Compose
# ============================================================
# `docker compose up -d --build` runs the whole stack: Postgres, MongoDB,
# Redis, the FastAPI backend and the built React frontend behind nginx.
# Requires a `.env` in this directory — copy `.env.example` and set a real
# SECRET_KEY (see the comment above it there).
#
# For local development with hot-reload, run only the databases here
# (`docker compose up -d postgres mongodb redis`) and start the backend /
# frontend on the host as start-backend.ps1 / start-frontend.ps1 do — the
# backend and frontend services below are for running the built app, not
# for iterating on it.
#
# Elasticsearch, Kafka and MinIO appeared in earlier drafts of this file
# but nothing in the codebase ever used them (only Postgres, MongoDB and
# Redis are wired into app/core/); they were removed rather than run for
# no reason. If a later module needs one, add it back deliberately.
# ============================================================

services:

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: itbis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itbis_db}
      POSTGRES_USER: ${POSTGRES_USER:-itbis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itbis_dev_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - itbis_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itbis_user} -d ${POSTGRES_DB:-itbis_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB ───────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: itbis_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-itbis_mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-itbis_dev_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-itbis_events}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - itbis_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: itbis_redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-itbis_dev_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - itbis_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-itbis_dev_password}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: itbis_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-true}
      # Required — the insecure pydantic default must not be used outside a
      # laptop. Generate one with: openssl rand -hex 32
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (openssl rand -hex 32) before starting the stack}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      # Container-to-container addresses — always the compose service name
      # and its internal port, independent of the host-side ports above
      # (those are only for tools running on the host, e.g. psql, mongosh).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-itbis_db}
      POSTGRES_USER: ${POSTGRES_USER:-itbis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itbis_dev_password}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-itbis_events}
      MONGO_USER: ${MONGO_USER:-itbis_mongo_user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-itbis_dev_password}
      MONGO_AUTH_SOURCE: admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-itbis_dev_password}
      REDIS_DB: "0"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - itbis_network

  # ─── Frontend (built SPA, served by nginx) ──────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: itbis_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - itbis_network

# ─── Networks ──────────────────────────────────────────────────
networks:
  itbis_network:
    driver: bridge
    name: itbis_network

# ─── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
    name: itbis_postgres_data
  mongodb_data:
    name: itbis_mongodb_data
  redis_data:
    name: itbis_redis_data
